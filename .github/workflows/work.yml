# Contrôles de conformité du plugin : syntaxe PHP.
# Workflows réutilisables maintenus par Jeedom, utilisés par les plugins officiels.
#
# On n'appelle pas leur agrégat `plugin.yml` : il impose aussi un passage sous
# PHP 7.4, que le plugin ne vise pas. Il exige Jeedom 4.4 sur Debian 12, donc
# PHP 8.2, et les bibliothèques embarquées du démon (php-mqtt/client 2.x,
# psr/log 3.x) demandent PHP 8.0 au minimum : sous 7.4 elles ne se chargent
# même pas. Ce passage échouait donc à juste titre, et l'exclure du lint en
# ignorant `resources/mqttbed/lib` n'aurait fait que masquer l'incompatibilité.
name: 'Full Workflows Plugin Jeedom'

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta, master]

jobs:
  php80:
    uses: jeedom/workflows/.github/workflows/lint_Php80.yml@main
  php82:
    uses: jeedom/workflows/.github/workflows/lint_Php82.yml@main
