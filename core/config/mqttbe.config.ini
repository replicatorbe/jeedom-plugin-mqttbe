; Valeurs par défaut du plugin, lues par config::byKey(<clé>, 'mqttbe').
;
; La section doit porter l'identifiant du plugin : nommée [default], elle serait
; entièrement inerte et chaque config::byKey retomberait sur son défaut codé.
[mqttbe]

; Adresse du broker MQTT. Vide, le démon ne tente aucune connexion : c'est le
; seul réglage que l'utilisateur doit obligatoirement renseigner.
broker::host = ""
broker::port = 1883
broker::tls = 0
; Accepter un certificat que l'on ne peut pas vérifier — le cas d'un broker
; domestique à certificat auto-signé. À n'activer que sur un réseau de confiance.
broker::tlsInsecure = 0
broker::caFile = ""
broker::username = ""
broker::password = ""
; Signature de Jeedom auprès du broker, engendrée une fois à l'installation puis
; mémorisée : deux clients de même identifiant se déconnecteraient mutuellement
; en boucle.
broker::clientId = ""
; Silence toléré avant que le broker ne déclare la connexion morte, en secondes.
broker::keepalive = 60

; Port local par lequel Jeedom transmet ses ordres au démon. Il n'écoute que sur
; 127.0.0.1 : à changer seulement si ce port est déjà pris sur la machine.
daemon::socketport = 55062
; Délai d'accumulation avant d'envoyer un lot de messages à Jeedom, en secondes.
; Un broker bavard produit des dizaines de messages par seconde : sans ce
; regroupement, chacun coûterait une requête HTTP.
daemon::batchDelay = 0.2

; Découverte automatique des équipements. Désactivée, le plugin se contente de
; router ce que ses commandes demandent : c'est le mode d'un utilisateur qui veut
; tout maîtriser à la main.
discovery::enabled = 1
; Créer directement les équipements découverts. Désactivé, ils sont seulement
; signalés et attendent une adoption explicite.
discovery::autoCreate = 1
; Nombre maximal d'équipements que la découverte peut créer d'elle-même. Au-delà,
; les appareils suivants attendent une adoption explicite : la découverte se
; fonde sur ce qui circule sur le broker, et rien n'oblige ce qui circule à être
; honnête. 0 désactive le plafond.
discovery::maxDevices = 250

; Adapters actifs, séparés par des virgules. Vide : tous ceux que le démon connaît.
discovery::adapters = "shelly.gen1"

; Numéro de la dernière table de routage transmise au démon. Écrit par le plugin,
; jamais à modifier à la main : il doit croître sans jamais reculer, faute de quoi
; le démon refuse les tables suivantes et n'aiguille plus rien.
routing::version = 0

; Motifs de topics ignorés, un par ligne. Par défaut ce que Jeedom publie
; lui-même — le réabsorber reviendrait à découvrir ses propres équipements — et
; les topics internes du broker.
topics::exclude = "jeedom/#
$SYS/#"
